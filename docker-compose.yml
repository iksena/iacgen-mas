services:
  neo4j:
    image: neo4j:5.20-community
    container_name: iacgen-mas-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  chromadb:
    image: chromadb/chroma:1.5.8
    container_name: iacgen-mas-chromadb
    ports:
      - "8000:8000"
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/data

volumes:
  neo4j_data:
    name: iacgen-mas_neo4j_data
  neo4j_logs:
    name: iacgen-mas_neo4j_logs
  chromadb_data:
    name: iacgen-mas_chromadb_data
